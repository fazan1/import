  {p:11,n:'Knotting speed',v:'80',k:'num',unit:'speed',what:'Speed at which the knotter ties the yarn end. Too fast and the knot is loose or misformed; too slow adds dead time.',a:{t:'Value too HIGH',items:['Loose, slip-prone knots; knotter misses the wrap','Yarn tail too long inside the glove']},aDo:'Decrease to 60–70 if knots slip or tails are long.',b:{t:'Value too LOW',items:['Knotting station becomes the bottleneck of the cycle']},bDo:'Increase toward 90 once knots are consistently tight and small.'},
  {p:11,n:'Idling laps',v:'5',k:'num',unit:'laps',what:'Empty courses the machine knits at start/end with no product, to settle the yarn, clear the feeders and stabilize tension before real knitting.',a:{t:'Value too HIGH',items:['Wasted yarn and time on every piece','Long loose chain at the start can tangle in the sinkers']},aDo:'Decrease to 3–4 if starts are stable and yarn cost matters.',b:{t:'Value too LOW',items:['First real courses are loose or uneven — rejects at the cuff','Yarn not yet seated when production starts']},bDo:'Increase to 5–6 if the first rows show loose stitches or tension wobble.'},
  {p:11,n:'First-run speed',v:'40',k:'num',unit:'speed',what:'Speed of the very first cycle after loading a pattern or resetting — a verification run to check the pattern forms correctly before full production.',a:{t:'Value too HIGH',items:['Errors discovered only at full speed — a full batch of bad gloves before anyone notices','Crashing the carriage into a mis-set cam at speed']},aDo:'Keep it low (30–50). Never raise the first-run speed to save time.',b:{t:'Value too LOW',items:['Only cost is a slower verification pass — no quality downside']},bDo:'No need to increase; if anything, keep this the slowest speed on the machine.'},
  {p:11,n:'Speed of releasing elastic yarn',v:'80',k:'num',unit:'speed',what:'Speed while the elastic yarn is being released/relaxed at the end of the wrist section, before cut-off.',a:{t:'Value too HIGH',items:['Elastic released with a snap — tension spike snaps the elastic','Wrist edge puckers after release']},aDo:'Decrease to 60–70 if elastic snaps at release or the edge puckers.',b:{t:'Value too LOW',items:['Release takes too long; elastic may relax unevenly and leave a wavy edge']},bDo:'Increase toward 90–100 if the edge looks stretched or wavy after release.'},
  {p:11,n:'Number of elastic yarn on the end of wrist',v:'1',k:'num',unit:'strands',what:'How many elastic threads are knitted into the wrist edge. 1 = standard elastic edge; 2 = stronger, tighter cuff.',a:{t:'Value too HIGH (2 strands)',items:['Wrist too tight — hard to put on, elastic marks on skin','Double elastic cost and more elastic breakage']},aDo:'Decrease to 1 unless the order explicitly calls for a reinforced elastic wrist.',b:{t:'Value too LOW',items:['Wrist edge loose — glove slips off the hand','Cuff rolls over during wear']},bDo:'Increase to 2 only for orders requiring a firm grip cuff, and lower insert speed accordingly.'},
  {p:11,n:'Elastic yarn final release value',v:'25',k:'num',unit:'value',what:'How much tension is released from the elastic right before cut-off — controls how the elastic tail behaves at the final stitch.',a:{t:'Value too HIGH',items:['Elastic springs back too far — long loose tail at the wrist','Tail sticks out of the overlock seam']},aDo:'Decrease toward 15–20 if you see loose elastic tails after cutting.',b:{t:'Value too LOW',items:['Elastic stays tight at the cut — puckered or gathered edge','Elastic snaps at the cut point from residual tension']},bDo:'Increase toward 25–30 if the wrist edge puckers or elastic keeps snapping at cut-off.'},
  {p:11,n:'Speed after oiling',v:'100',k:'num',unit:'speed',what:'Speed the machine returns to after lubrication, paired with the slow-running laps below so oil spreads before full production.',a:{t:'Value too HIGH',items:['Oil not distributed yet — dry spots wear needles and cams','Oil throw-off contaminates the yarn and fabric']},aDo:'Keep it at or below 100 until the slow laps are finished; let the laps do their job.',b:{t:'Value too LOW',items:['Only delays return to production — no quality benefit']},bDo:'Once the slow laps complete, the machine can rise to normal speeds automatically.'},
  {p:11,n:'Laps of slow running after oiling',v:'5',k:'num',unit:'laps',what:'How many slow courses the machine runs after oiling to spread lubricant across the needle bed before speed rises.',a:{t:'Value too HIGH',items:['Small time loss only — no harm to the machine']},aDo:'5 is already generous; 3–4 is enough for daily oiling.',b:{t:'Value too LOW (or skipped)',items:['Oil stays pooled at feed points — dry cams and needle hooks later','Staining on the first gloves from excess oil']},bDo:'Increase to 5–6 after a full oil service or if the first pieces after oiling show marks or stiffness.'},
  {p:11,n:'Needle breakage detection function',v:'OFF',k:'toggle',what:'When ON, the machine stops automatically the moment a needle breaks — protecting the needle bed and the fabric.',a:{t:'When to turn it ON',items:['When knitting expensive yarns or fine gauges where a broken needle ruins many courses','On night shifts with no operator watching']},b:{t:'When OFF (current)',items:['Acceptable with an attentive operator and cheap yarn','Turn OFF if dust causes constant false trips — but clean the sensor instead if possible']}},
  {p:11,n:'Needle breakage detection interval',v:'0',k:'num',unit:'interval',what:'How often the breakage detector checks (in courses or seconds, per machine convention). 0 = checking at every cycle / fastest.',a:{t:'Value too HIGH',items:['Broken needle runs many courses before detection — larger damage']},aDo:'Decrease toward 0–1 so a break stops the machine almost immediately.',b:{t:'Value too LOW',items:['Sensor interrogates constantly — more false trips from lint and vibration']},bDo:'Increase the interval slightly only if false stops dominate with detection ON.'},
  {p:11,n:'Front needle quantity',v:'58',k:'num',unit:'needles',what:'Number of needles installed on the front bed for this machine/model. It is a machine specification, not a production setting.',a:{t:'Never increase',items:['More needles than the bed is built for damages cams and carriage','Pattern coordinates all shift — every glove becomes wrong']},aDo:'Do not change. If this number is wrong, the pattern file or machine model setting is wrong — fix that instead.',b:{t:'Never decrease',items:['Fewer needles narrows the fabric — wrong glove width','Empty needle slots snag yarn and drop stitches']},bDo:'Do not change. Needle count is set at installation and verified at maintenance.'},
  {p:11,n:'Rear needle quantity',v:'58',k:'num',unit:'needles',what:'Number of needles on the rear bed — again a fixed machine specification for this model.',a:{t:'Never increase',items:['Same consequences as front bed — mechanical damage and pattern shift']},aDo:'Do not change; verify only during needle-bed maintenance.',b:{t:'Never decrease',items:['Rear bed gaps cause ladders and holes exactly where half needles work']},bDo:'Do not change. If gloves show odd holes at the palm taper, inspect needles — do not edit this value.'},
  {p:11,n:'Stop main yarn before resetting',v:'OFF',k:'toggle',what:'When ON, the main yarn is cut and stopped before the machine resets, so the reset cannot pull loops out of the fabric on the bed.',a:{t:'When to turn it ON',items:['When resets keep pulling yarn and dropping courses from the piece on the bed','With slippery yarns that slide under tension']},b:{t:'When OFF (current)',items:['Fine for normal stops where the piece stays parked correctly','One less cut per reset — slightly less yarn waste']}},
  {p:11,n:'Laps of three-finger conjoined palm',v:'0',k:'num',unit:'laps',what:'Courses knitted in conjoined (joined) structure for the three-finger section of mitten-style patterns. 0 = feature unused.',a:{t:'Value too HIGH',items:['On a normal glove this creates a wrongly joined, thick palm section']},aDo:'Keep at 0 unless running the conjoined pattern type this setting belongs to.',b:{t:'Value too LOW',items:['Only wrong when the conjoined pattern IS running — then the joined section is too short']},bDo:'When running conjoined styles, set per the pattern card for that style.'},
  {p:11,n:'Depth of pressing needle (overlocking)',v:'0',k:'num',unit:'depth',what:'How deep the overlock presser sinks the needles when forming the wrist seam. 0 = default/standard press depth.',a:{t:'Value too HIGH',items:['Needles over-bent — breakage and damaged hooks','Wrist seam too tight, fabric puckers']},aDo:'Decrease toward 0 if overlocking causes needle damage or a gathered seam.',b:{t:'Value too LOW',items:['Presser does not form the seam — skipped overlock stitches','Elastic edge not captured, wrist unravels']},bDo:'Increase in small steps only if the overlock seam skips stitches with a healthy presser.'},
  {p:11,n:'Distance of yarn fixing on palm',v:'0',k:'num',unit:'distance',what:'Where on the palm the yarn is fixed/tacked during formation. 0 = standard position at the palm base.',a:{t:'Value too HIGH',items:['Tack point too high on the palm — visible bump or tension mark in the glove body']},aDo:'Return to 0 unless a specific pattern card calls for a moved tack point.',b:{t:'Value too LOW',items:['Yarn fixed too low — insufficient hold, first palm courses loosen']},bDo:'Leave at 0 for standard patterns; adjust only per pattern documentation.'},
  {p:12,n:'Hook yarn laps (overlocking)',v:'1',k:'num',unit:'laps',what:'How many wraps the hook yarn takes when catching the wrist edge for overlocking.',a:{t:'Value too HIGH',items:['Bulky overlock start, yarn build-up at the seam corner','Longer cycle, more yarn']},aDo:'Decrease to 1 if the seam start is bulky; 1 is standard.',b:{t:'Value too LOW',items:['Hook misses or releases the edge — overlock seam does not start','Wrist edge opens after washing']},bDo:'Increase to 2 only if the seam start repeatedly misses on slippery yarn.'},
  {p:12,n:'Cut yarn laps (overlocking)',v:'1',k:'num',unit:'laps',what:'Wraps the cutter yarn takes before the final cut at the wrist overlock.',a:{t:'Value too HIGH',items:['Yarn bundle too thick to cut cleanly — frayed ends','Extra yarn consumption']},aDo:'Decrease to 1 if the cut end frays; check cutter blade sharpness too.',b:{t:'Value too LOW',items:['Cut end slips back and unravels before the overlock captures it']},bDo:'Increase to 2 if wrist ends unravel before sealing.'},
  {p:12,n:'Hide yarn ends function (overlocking)',v:'ON',k:'toggle',what:'Automatically tucks the cut yarn tail into the fabric so the inside of the glove has no loose ends.',a:{t:'When ON (current)',items:['Clean inside finish — no irritation for the wearer','Essential for inspection-passing first-quality gloves']},b:{t:'When to turn it OFF',items:['Rarely — only if the hiding action itself marks the fabric on very fine yarns']}},
  {p:12,n:'Adjusting knitting speed',v:'OFF',k:'toggle',what:'Lets the machine slow down automatically in dense/tight sections (like the wrist) where needle load is highest.',a:{t:'When to turn it ON',items:['When knitting dense cuffs at high production speed and needles keep breaking','When the wrist section shows tension marks at full speed']},b:{t:'When OFF (current)',items:['Fine when the machine runs comfortably at constant speed','Slightly faster cycle, simpler behaviour']}},
  {p:12,n:'Density location of hiding yarn ends',v:'243',k:'num',unit:'position',what:'The exact stitch/course coordinate where the yarn-end hiding action happens. It is a pattern-file value, not tuned by hand.',a:{t:'Wrong value',items:['Hide point lands mid-pattern — visible dip or mark on the glove face','Yarn end not hidden at all']},aDo:'Do not adjust by trial. Restore the value from the original pattern file for this glove model.',b:{t:'Wrong value',items:['Same as above — the coordinate must match the pattern file exactly']},bDo:'Reload the pattern or re-enter 243 per the pattern card.'},
  {p:12,n:'Density value of hiding yarn ends',v:'16',k:'num',unit:'density',what:'Fabric density used at the yarn-hiding point — the machine briefly knits tighter to lock the tail in.',a:{t:'Value too HIGH',items:['Hide point much tighter than surrounding fabric — visible ring or gauge mark']},aDo:'Match it to the neighbouring density values (±1–2) if a ring shows.',b:{t:'Value too LOW',items:['Tail not locked — works loose after washing and wear']},bDo:'Increase toward the local density if tails come out of the fabric.'},
  {p:12,n:'Sub/scissors idling movement',v:'0',k:'num',unit:'value',what:'Idle positioning movement of the sub-scissors mechanism. 0 = no idle offset.',a:{t:'Value too HIGH',items:['Sub scissors sit away from home — slower response, wrong cut timing']},aDo:'Return to 0 unless the mechanism documentation specifies an offset.',b:{t:'Value too LOW',items:['No issue — 0 is the normal resting setting']},bDo:'Keep at 0.'},
  {p:12,n:'Laps of insert yarn at little finger tip',v:'0',k:'num',unit:'laps',what:'Extra reinforcement yarn inserted at the little-finger tip. 0 = off — currently no reinforcement anywhere (all five finger tips are 0).',a:{t:'Value too HIGH',items:['Tip becomes stiff and thick — uncomfortable, looks different from spec','Extra yarn and cycle time on every piece']},aDo:'Keep 0 unless the order is for reinforced/wear-resistant gloves; then set per the spec sheet.',b:{t:'Value too LOW (0)',items:['No reinforcement — tips wear through fast on heavy-duty gloves']},bDo:'For anti-wear orders, set typically 2–4 laps at the specified fingers only, and test one glove for stiffness.'}

    var rows = D.map(function (m, i) { return { m: m, i: i }; }).filter(function (x) { return x.m.p === page; });
    listEl.innerHTML = tableHtml + rows.map(function (x) {
      return '<button class="gm-row' + (x.i === sel ? ' gm-on' : '') + '" data-i="' + x.i + '">' +
        '<span class="gm-name">' + esc(x.m.n) + '</span>' +
        '<span class="gm-kind">' + KIND[x.m.k] + '</span>' +
        '<span class="gm-val">' + esc(x.m.v) + (x.m.unit ? ' ' + x.m.unit : '') + '</span></button>';
    }).join('');
  }

  function markGlove() {
    var on = listEl.querySelector('[data-i="' + sel + '"]');
    if (on) on.classList.add('gm-on');
  }

  function renderTablePage() {
    var p = PAGES[TABLEPAGEMAP[page]];
    var html = '<div style="text-align:center;font-size:12px;color:var(--kimi-color-text-tertiary);margin:8px 0 6px">' + esc(p.caption) + '</div><table style="border-collapse:collapse;margin:0 auto;min-width:420px"><thead><tr>';
    p.cols.forEach(function (cn, ci) {
      html += '<th data-c="' + p.colKeys[ci] + '"' + (tSelCol === ci ? ' class="gt-on"' : '') + ' style="font-size:12px;font-weight:500;color:var(--kimi-color-text-tertiary);padding:6px 10px;border:1px solid var(--kimi-color-border);background:var(--kimi-color-surface-muted);cursor:pointer;user-select:none">' + esc(cn) + '</th>';
    });
    html += '</tr></thead><tbody>';
    p.rows.forEach(function (r, ri) {
      html += '<tr>';
      r.forEach(function (v, ci) {
        if (ci === 0) html += '<td class="gt-rowno' + (tSelRow === ri ? ' gt-nonzero' : '') + '" data-r="' + ri + '">' + v + '</td>';
        else html += '<td' + (v !== 0 ? ' class="gt-nonzero"' : '') + '>' + v + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    if (p.buttons && p.buttons.length) {
      html += '<div style="display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap">' + p.buttons.map(function (b) { return '<button class="gt-bbtn" data-b="' + esc(b) + '">' + esc(b) + '</button>'; }).join('') + '</div>';
    }
    html += '<div style="font-size:12px;color:var(--kimi-color-text-tertiary);text-align:center;margin:8px 0 10px">Highlighted cells = active values · 0 = ignored · tap a column header or row number</div>';
    return html;
  }

  function renderDetail() {
    if (sel < 0) { detEl.innerHTML = ''; return; }
    var m = D[sel];
    var cols;
    if (m.k === 'toggle') {
      cols = '<div class="gm-col gm-col-a"><div class="gm-col-title">' + UP + ' ' + esc(m.a.t) + '</div><ul>' +
        m.a.items.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="gm-col gm-col-b"><div class="gm-col-title">' + DN + ' ' + esc(m.b.t) + '</div><ul>' +
        m.b.items.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
    } else if (m.k === 'select' || m.k === 'tech') {
      cols = '<div class="gm-col gm-col-a"><div class="gm-col-title">' + UP + ' ' + esc(m.a.t) + '</div><ul>' +
        m.a.items.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' +
        (m.aDo ? '<div class="gm-act"><b>Action:</b> ' + esc(m.aDo) + '</div>' : '') + '</div>';
    } else {
      cols = '<div class="gm-col gm-col-a"><div class="gm-col-title">' + UP + ' ' + esc(m.a.t) + '</div><ul>' +
        m.a.items.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' +
        '<div class="gm-act"><b>Action:</b> ' + esc(m.aDo) + '</div></div>' +
        '<div class="gm-col gm-col-b"><div class="gm-col-title">' + DN + ' ' + esc(m.b.t) + '</div><ul>' +
        m.b.items.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' +
        '<div class="gm-act"><b>Action:</b> ' + esc(m.bDo) + '</div></div>';
    }
    detEl.innerHTML = '<div class="gm-d-head"><span class="gm-d-title">' + esc(m.n) + '</span>' +
      '<span class="gm-chip">' + esc(m.v) + (m.unit ? ' ' + m.unit : '') + '</span>' +
      '<span class="gm-kind">' + KIND[m.k] + '</span></div>' +
      '<div class="gm-what">' + esc(m.what) + '</div>' +
      '<div class="gm-cols">' + cols + '</div>';
    detEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function showTableColumn(ci) {
    var p = PAGES[TABLEPAGEMAP[page]];
    var key = p.colKeys[ci];
    if (key === 'no' || key === 'fno' || key === 'rno') {
      detEl.innerHTML = '<div class="gm-d-head"><span class="gm-d-title">Row numbers</span></div><div class="gm-what">Tap a row number on the left of any row to explain that row\'s values.</div>'; return;
    }
    var e = p.colExplain[key];
    if (!e) { detEl.innerHTML = '<div class="gm-what">This column behaves like Start/End Row on the other tables.</div>'; return; }
    detEl.innerHTML = '<div class="gm-d-head"><span class="gm-d-title">' + esc(e.t) + '</span><span class="gm-chip">column</span></div>' +
      '<div class="gm-what">' + esc(e.what) + '</div>' +
      '<div class="gm-cols"><div class="gm-col gm-col-a"><div class="gm-col-title">' + UP2 + ' When it\'s wrong / too high</div>' + esc(e.h[0]) + '</div>' +
      '<div class="gm-col"><div class="gm-act"><b>What to do:</b> ' + esc(e.hd) + '</div></div></div>';
    detEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function showTableRow(ri) {
    var p = PAGES[TABLEPAGEMAP[page]];
    var e = p.rowExplain && p.rowExplain[p.rows[ri][0]];
    if (e) {
      detEl.innerHTML = '<div class="gm-d-head"><span class="gm-d-title">' + esc(e.t) + '</span><span class="gm-chip">' + esc(e.v) + '</span></div>' +
        '<div class="gm-what">' + esc(e.what) + '</div>' +
        '<div class="gm-cols">' +
        '<div class="gm-col gm-col-a"><div class="gm-col-title">' + UP2 + ' If the values are too HIGH</div>' + e.h.map(esc).join('<br>') + '</div>' +
        '<div class="gm-col gm-col-b"><div class="gm-col-title">' + DN + ' If the values are too LOW</div>' + e.l.map(esc).join('<br>') + '</div>' +
        '<div class="gm-col" style="grid-column:1/-1"><div class="gm-act"><b>Too high →</b> ' + esc(e.hd) + '<br><b>Too low →</b> ' + esc(e.ld) + '</div></div></div>';
    } else if (p.allZero) {
      detEl.innerHTML = '<div class="gm-d-head"><span class="gm-d-title">' + esc(p.allZero.t) + '</span><span class="gm-chip">this machine</span></div>' +
        '<div class="gm-what">' + esc(p.allZero.what) + '</div>' +
        '<div class="gm-act"><b>Watch out:</b> ' + esc(p.allZero.h[0]) + '<br><b>What to do:</b> ' + esc(p.allZero.hd) + '</div>';
    } else {
      detEl.innerHTML = '<div class="gm-what" style="color:var(--kimi-color-text-tertiary)">This row is all zeros — the machine ignores it.</div>';
    }
    detEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  tabsEl.addEventListener('click', function (e) {
    var t = e.target.closest('.gm-tab');
    if (!t) return;
    page = +t.getAttribute('data-p'); sel = -1; tSelCol = null; tSelRow = null;
    renderTabs(); renderList();
    detEl.innerHTML = '<div class="gm-what" style="color:var(--kimi-color-text-tertiary)">' + (page <= 6 ? 'Tap a zone, column header, row number or button above to see the explanation.' : 'Tap any setting to see what it means and when to raise or lower it.') + '</div>';
  });

  listEl.addEventListener('click', function (e) {
    var th = e.target.closest('th');
    if (th && TABLEPAGEMAP[page] !== undefined) {
      tSelCol = Array.prototype.indexOf.call(th.parentNode.children, th); tSelRow = null; sel = -1;
      renderList(); showTableColumn(tSelCol); return;
    }
    var rn = e.target.closest('.gt-rowno');
    if (rn && TABLEPAGEMAP[page] !== undefined) {
      tSelRow = +rn.getAttribute('data-r'); tSelCol = null; sel = -1;
      renderList(); showTableRow(tSelRow); return;
    }
    var bb = e.target.closest('.gt-bbtn');
    if (bb && TABLEPAGEMAP[page] !== undefined) {
      var b = bb.getAttribute('data-b');
      var msg = { 'Delete All': 'Clears the whole table in one action — no undo. Photograph active rows (like density row 1 or blow row 1) before pressing it.',
                  'Copy All': 'Copies the Front half into the Rear half. After copying, re-check rows meant to differ — like density row 1 (front 7, rear 10).',
                  'Aux Set': 'Opens auxiliary sub yarn parameters — feeder tension and timing. Technician values: restore recorded numbers after any feeder service.',
                  'Sub Sci': 'Jumps to the sub scissors settings — the sub yarn can only be cut cleanly if these are active.',
                  'Next': 'Shows rows 11–20 of this table.',
                  'Prev': 'Returns to the previous screen.' }[b];
      detEl.innerHTML = '<div class="gm-d-head"><span class="gm-d-title">' + esc(b) + '</span><span class="gm-chip">button</span></div><div class="gm-what">' + esc(msg) + '</div>';
      return;
    }
    var r = e.target.closest('[data-i]');
    if (r) {
      sel = +r.getAttribute('data-i'); tSelCol = null; tSelRow = null;
      renderList(); renderDetail();
    }
  });

  renderTabs(); renderList();
  detEl.innerHTML = '<div class="gm-what" style="color:var(--kimi-color-text-tertiary)">Tap a zone number or a tool button above to see the explanation.</div>';
})();
</script>
</body>
</html>
