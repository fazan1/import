<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern settings — 10-gauge glove knitting machine</title>
<style>
:root{--kimi-color-text-primary:#1a1a1a;--kimi-color-text-secondary:#4d4d4d;--kimi-color-text-tertiary:#8c8c8c;--kimi-color-surface:#fff;--kimi-color-surface-muted:#f5f5f5;--kimi-color-surface-strong:#ececec;--kimi-color-border:#e0e0e0;--kimi-color-danger:#d4380d;--kimi-color-positive:#389e0d;--kimi-color-accent:#e8552a;--t-fast:120ms;--t-normal:200ms;--ease-out:cubic-bezier(.16,1,.3,1)}
@media (prefers-color-scheme:dark){:root{--kimi-color-text-primary:#e8e8e8;--kimi-color-text-secondary:#b3b3b3;--kimi-color-text-tertiary:#7a7a7a;--kimi-color-surface:#161616;--kimi-color-surface-muted:#1f1f1f;--kimi-color-surface-strong:#2e2e2e;--kimi-color-border:#333;--kimi-color-danger:#ff4d2e;--kimi-color-positive:#58c224;--kimi-color-accent:#e8552a}}
html,body{margin:0;background:var(--kimi-color-surface)}body{max-width:900px;margin:0 auto;padding:20px 14px;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
<style>
  .gm-root { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--kimi-color-text-primary); }
  .gm-root button { font: inherit; }
  .gm-head { margin-bottom: 12px; }
  .gm-title { font-size: 20px; font-weight: 500; letter-spacing: 0; }
  .gm-sub { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-top: 2px; }
  .gm-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .gm-tab { font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--kimi-color-border); background: transparent; color: var(--kimi-color-text-secondary); cursor: pointer; transition: all var(--t-fast) var(--ease-out); }
  .gm-tab:hover { border-color: var(--kimi-color-text-secondary); }
  .gm-tab.gm-on { background: var(--kimi-color-text-primary); color: var(--kimi-color-surface); border-color: var(--kimi-color-text-primary); }
  .gm-list { border: 1px solid var(--kimi-color-border); border-radius: 12px; overflow: hidden; }
  .gm-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 14px; background: transparent; border: none; border-bottom: 1px solid var(--kimi-color-border); cursor: pointer; transition: background var(--t-fast) var(--ease-out); }
  .gm-row:last-child { border-bottom: none; }
  .gm-row:hover { background: var(--kimi-color-surface-muted); }
  .gm-row.gm-on { background: var(--kimi-color-surface-muted); box-shadow: inset 2px 0 0 var(--kimi-color-text-primary); }
  .gm-name { flex: 1; font-size: 14px; min-width: 0; }
  .gm-kind { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--kimi-color-surface-strong); color: var(--kimi-color-text-tertiary); flex: 0 0 auto; }
  .gm-val { font-size: 14px; font-weight: 500; min-width: 88px; text-align: right; font-variant-numeric: tabular-nums; }
  .gm-detail { margin-top: 12px; border: 1px solid var(--kimi-color-border); border-radius: 12px; padding: 16px; animation: gmin var(--t-normal) var(--ease-out); }
  @keyframes gmin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .gm-d-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .gm-d-title { font-size: 17px; font-weight: 500; }
  .gm-chip { font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 6px; background: var(--kimi-color-surface-strong); font-variant-numeric: tabular-nums; }
  .gm-what { font-size: 14px; color: var(--kimi-color-text-secondary); line-height: 22px; margin-bottom: 12px; max-width: 76ch; }
  .gm-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .gm-cols { grid-template-columns: 1fr; } }
  .gm-col { border: 1px solid var(--kimi-color-border); border-radius: 10px; padding: 12px; }
  .gm-col-a { border-color: color-mix(in srgb, var(--kimi-color-danger) 40%, transparent); }
  .gm-col-b { border-color: color-mix(in srgb, var(--kimi-color-accent) 40%, transparent); }
  .gm-col-title { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .gm-col-a .gm-col-title { color: var(--kimi-color-danger); }
  .gm-col-b .gm-col-title { color: var(--kimi-color-accent); }
  .gm-col ul { margin: 0 0 10px; padding-left: 16px; font-size: 13px; color: var(--kimi-color-text-secondary); line-height: 20px; }
  .gm-act { font-size: 13px; line-height: 20px; border-top: 1px solid var(--kimi-color-border); padding-top: 8px; }
  .gm-act b { font-weight: 500; }
  .gm-foot { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gm-note { font-size: 12px; color: var(--kimi-color-text-tertiary); }

  .gm-draw { display: block; width: 100%; max-width: 460px; margin: 0 auto; padding: 8px 0 0; }
  .gm-zone { cursor: pointer; }
  .gm-zone .zr { fill: transparent; stroke: var(--kimi-color-border); stroke-width: 1.5; transition: fill var(--t-fast) var(--ease-out), stroke var(--t-fast) var(--ease-out); }
  .gm-zone:hover .zr, .gm-zone.gm-on .zr { fill: var(--kimi-color-surface-muted); stroke: var(--kimi-color-text-primary); }
  .gm-zone text { font-family: inherit; font-size: 20px; font-weight: 500; fill: var(--kimi-color-text-secondary); font-variant-numeric: tabular-nums; }
  .gm-zone:hover text, .gm-zone.gm-on text { fill: var(--kimi-color-text-primary); }
  .gm-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
  .gm-chipbtn { font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--kimi-color-border); background: transparent; color: var(--kimi-color-text-secondary); cursor: pointer; transition: all var(--t-fast) var(--ease-out); }
  .gm-chipbtn:hover { border-color: var(--kimi-color-text-secondary); }
  .gm-chipbtn.gm-on { border-color: var(--kimi-color-text-primary); color: var(--kimi-color-text-primary); background: var(--kimi-color-surface-muted); }

.gt-root{color:var(--kimi-color-text-primary)}
.gt-root button{font:inherit}
.gt-head{margin-bottom:10px}
.gt-title{font-size:19px;font-weight:500}
.gt-sub{font-size:12px;color:var(--kimi-color-text-tertiary);margin-top:2px}
.gt-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.gt-tab{font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--kimi-color-border);background:transparent;color:var(--kimi-color-text-secondary);cursor:pointer}
.gt-tab:hover{border-color:var(--kimi-color-text-secondary)}
.gt-tab.gt-on{background:var(--kimi-color-text-primary);color:var(--kimi-color-surface);border-color:var(--kimi-color-text-primary)}
.gt-tablewrap{border:1px solid var(--kimi-color-border);border-radius:12px;padding:10px;overflow-x:auto}
.gt-tablewrap table{border-collapse:collapse;margin:0 auto;min-width:420px}
.gt-tablewrap th{font-size:12px;font-weight:500;color:var(--kimi-color-text-tertiary);padding:6px 10px;border:1px solid var(--kimi-color-border);background:var(--kimi-color-surface-muted);cursor:pointer;user-select:none}
.gt-tablewrap th.gt-on{background:var(--kimi-color-text-primary);color:var(--kimi-color-surface)}
.gt-tablewrap td{font-size:14px;padding:5px 10px;border:1px solid var(--kimi-color-border);text-align:center;font-variant-numeric:tabular-nums;color:var(--kimi-color-text-secondary)}
.gt-tablewrap td.gt-rowno{color:var(--kimi-color-text-tertiary);cursor:pointer;user-select:none}
.gt-tablewrap td.gt-rowno:hover{color:var(--kimi-color-text-primary);background:var(--kimi-color-surface-muted)}
.gt-tablewrap td.gt-nonzero{color:var(--kimi-color-text-primary);font-weight:500;background:rgba(56,158,13,.07)}
.gt-hint{font-size:12px;color:var(--kimi-color-text-tertiary);text-align:center;margin-top:8px}
.gt-btns{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.gt-bbtn{font-size:12px;padding:4px 10px;border-radius:7px;border:1px solid var(--kimi-color-border);background:transparent;color:var(--kimi-color-text-secondary);cursor:pointer}
.gt-bbtn:hover{border-color:var(--kimi-color-text-secondary)}
.gt-explain{margin-top:10px;border:1px solid var(--kimi-color-border);border-left:3px solid var(--kimi-color-text-primary);border-radius:10px;padding:12px 14px;min-height:40px}
.gt-ex-title{font-size:14px;font-weight:500;margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gt-ex-chip{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--kimi-color-surface-strong);color:var(--kimi-color-text-tertiary)}
.gt-ex-what{font-size:13px;color:var(--kimi-color-text-secondary);line-height:20px;margin-bottom:8px}
.gt-ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.gt-ex-grid{grid-template-columns:1fr}}
.gt-ex-col{border:1px solid var(--kimi-color-border);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:19px;color:var(--kimi-color-text-secondary)}
.gt-ex-col b{display:block;font-weight:500;margin-bottom:3px}
.gt-ex-h{color:var(--kimi-color-danger)}
.gt-ex-l{color:var(--kimi-color-accent)}
.gt-ex-act{grid-column:1/-1;border-top:1px solid var(--kimi-color-border);padding-top:6px;font-size:12.5px;color:var(--kimi-color-text-secondary)}
.gt-ex-act b{color:var(--kimi-color-text-primary);font-weight:500}
  .gt-rowno{color:var(--kimi-color-text-tertiary);cursor:pointer;user-select:none}
  .gt-rowno:hover{color:var(--kimi-color-text-primary);background:var(--kimi-color-surface-muted)}
  .gt-nonzero{color:var(--kimi-color-text-primary);font-weight:500;background:rgba(56,158,13,.07)}
  .gm-list td{font-size:14px;padding:5px 10px;border:1px solid var(--kimi-color-border);text-align:center;font-variant-numeric:tabular-nums;color:var(--kimi-color-text-secondary)}
  .gm-list th.gt-on{background:var(--kimi-color-text-primary) !important;color:var(--kimi-color-surface) !important}
</style>

<body>
<div class="gm-root">
  <div class="gm-head">
    <div class="gm-title">Pattern settings — 10-gauge glove knitting machine</div>
    <div class="gm-sub" id="gmCaption"></div>
  </div>
  <div class="gm-tabs" id="gmTabs"></div>
  <div class="gm-list" id="gmList" style="overflow-x:auto"></div>
  <div class="gm-detail" id="gmDetail"></div>
  <div class="gm-foot">
    <span class="gm-note">Values transcribed from your machine photos. Settings marked "technician set" should not be changed on the floor — restore recorded values after any service.</span>
  </div>
</div>
<script>
(function () {
  var UP = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>';
  var DN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>';
  var UP2 = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>';

var D = [
  {p:1,n:'Zone — cuff elastic band (top of wrist)',v:'8',k:'num',unit:'value',what:'Top edge of the wrist where the elastic yarn is knitted in. The number is whatever parameter the active Set mode assigns to this zone — laps of elastic when Elastic Yarn Set is selected.',a:{t:'Value too HIGH',items:['Cuff edge very tight and thick — hard to pull over the hand','More elastic used per glove, more elastic breakage at the edge']},aDo:'Decrease toward the pattern-card value if the edge feels board-stiff or elastic keeps snapping.',b:{t:'Value too LOW',items:['Weak elastic edge — cuff rolls up or lifts away','Edge can unravel after washing']},bDo:'Increase gradually until the edge holds its shape but still stretches comfortably over the hand.'},
  {p:1,n:'Zone — wrist',v:'28',k:'num',unit:'value',what:'Main wrist section value — typically the density (stitch length) of the ribbed cuff area.',a:{t:'Value too HIGH',items:['Tight wrist — hard to put on and take off','Elastic pressure marks on the skin after wear']},aDo:'Decrease by 1–2 if operators complain the wrist is tight or marks appear.',b:{t:'Value too LOW',items:['Cuff slips off the hand during work','Wrist looks floppy and loose']},bDo:'Increase by 1–2 if gloves fall off or the cuff gapes.'},
  {p:1,n:'Zone — back of hand',v:'30',k:'num',unit:'value',what:'Back-of-hand zone value, usually density. The back carries most of the visible shaping of the glove.',a:{t:'Value too HIGH',items:['Stiff back — poor bending, hand tires quickly','Fabric can crackle or stress when flexed']},aDo:'Decrease by 1–2 if the back feels board-stiff during wear trials.',b:{t:'Value too LOW',items:['Baggy back — wrinkles, poor appearance','Glove slides around on the hand']},bDo:'Increase by 1–2 if the back looks loose or wrinkled on the hand.'},
  {p:1,n:'Zone — thumb',v:'44',k:'num',unit:'value',what:'Thumb zone covering the thumb body and its root. Values here strongly affect grip comfort.',a:{t:'Value too HIGH',items:['Tight thumb — restricted movement, grip weakens','Yarn breaks at the thumb root, webbing stressed']},aDo:'Decrease by 1–2 if the thumb feels tight or yarn breaks at the root.',b:{t:'Value too LOW',items:['Loose thumb — webbing sags and rubs','Holes develop at the thumb root over time']},bDo:'Increase by 1–2 if the thumb webbing feels loose or wears early.'},
  {p:1,n:'Zone — palm',v:'26',k:'num',unit:'value',what:'Palm zone value — usually set slightly looser than the back of the hand so the glove can close around objects.',a:{t:'Value too HIGH',items:['Stiff palm — poor grip feel, hand fatigues','Glove resists closing around tools']},aDo:'Decrease by 1–2 if gripping feels stiff.',b:{t:'Value too LOW',items:['Baggy palm — fabric bunches when gripping','Poor contact with tools, less dexterity']},bDo:'Increase by 1–2 if the palm bunches up in the hand.'},
  {p:1,n:'Zone — index finger',v:'48',k:'num',unit:'value',what:'Index-finger zone. Finger values should stay in proportion to each other — the drawing is the map of the whole hand.',a:{t:'Value too HIGH',items:['Tight finger — pressure on the nail, stiff fingertip','Visible density step against the neighbouring finger']},aDo:'Decrease toward the card value; keep the step to the middle finger similar to the original pattern.',b:{t:'Value too LOW',items:['Loose wrinkled finger — poor dexterity','Tip folds when gripping small parts']},bDo:'Increase toward the card value in steps of 1.'},
  {p:1,n:'Zone — middle finger',v:'54',k:'num',unit:'value',what:'Middle-finger zone — the longest finger, so it carries the highest value in the set (54).',a:{t:'Value too HIGH',items:['Visible density step between the fingers','Middle finger stiff, glove looks uneven on the hand']},aDo:'Decrease while keeping it the highest of the four finger values.',b:{t:'Value too LOW',items:['Middle finger sags — glove looks misshaped','Tip short or loose compared with the spec']},bDo:'Increase back toward 54; it should stay above ring and little finger.'},
  {p:1,n:'Zone — ring finger',v:'48',k:'num',unit:'value',what:'Ring-finger zone — normally matches or sits near the index finger value.',a:{t:'Value too HIGH',items:['Tight ring finger — discomfort and stiff tip','Mismatch against index finger if set higher']},aDo:'Decrease toward the card value, keeping it in line with the index finger.',b:{t:'Value too LOW',items:['Loose ring finger — wrinkles, poor fit']},bDo:'Increase toward the card value in steps of 1.'},
  {p:1,n:'Zone — little finger',v:'42',k:'num',unit:'value',what:'Little-finger zone — the smallest finger, so it carries the lowest value (42). The finger selector at the top of the machine screen refers to this zone.',a:{t:'Value too HIGH',items:['Little finger stiff and out of proportion with the spec','Density step visible against the ring finger']},aDo:'Decrease toward 42; the little finger should stay clearly the loosest of the four.',b:{t:'Value too LOW',items:['Little finger baggy — fabric folds, catches on edges']},bDo:'Increase toward the card value if the little finger looks loose.'},
  {p:1,n:'Tool — Speed Set',v:'mode',k:'tech',what:'Switches the pattern editor to speed mode — the numbers on the drawing then show the carriage speed for each zone instead of density.',a:{t:'When to use it',items:['Slow down dense or delicate zones — wrist, elastic insert, fingertip reinforcement','Speed up plain zones only after the seam and fingers knit clean at current speed']},aDo:'After any speed change, run one piece at first-run speed and inspect before full production.'},
  {p:1,n:'Tool — Elastic Yarn Set',v:'mode',k:'tech',what:'Elastic editing mode — set elastic laps and tension per zone. Normally only the cuff zones carry elastic values.',a:{t:'When to use it',items:['Set elastic values on the cuff zones per the order specification','Non-zero elastic on other zones wastes elastic and can pucker the fabric']},aDo:'Pair elastic changes with the elastic insert and release settings on page 5 for a consistent wrist.'},
  {p:1,n:'Tool — Density Set',v:'mode',k:'tech',what:'Density editing mode — the numbers shown on the drawing (8, 28, 30, 44, 26, 48, 54, 48, 42) are the density values of each zone when this mode is active. Higher number = tighter fabric.',a:{t:'When to use it',items:['Change zone density only for fit corrections requested by QA — a glove too tight or too loose in one zone','Move in steps of 1–2 and re-measure; big jumps show as visible gauge steps on the glove']},aDo:'Always compare with the pattern card before editing — the card values are the qualified baseline.'},
  {p:1,n:'Tool — Sub Yarn Set',v:'mode',k:'tech',what:'Sub yarn editing mode — assigns the reinforcement (second) yarn to chosen zones, normally palm and/or cuff.',a:{t:'When to use it',items:['Enable on palm and cuff zones only for heavy-duty or cut-resistant orders','Requires sub yarn function ON and sub scissors ON to actually knit']},aDo:'Match the zones to the order spec sheet — knitting sub yarn where it is not required wastes yarn.'},
  {p:1,n:'Tool — Knot Set',v:'mode',k:'tech',what:'Knot editing mode — controls knotting behaviour per zone for styles that tie off yarn inside the glove.',a:{t:'When to use it',items:['Leave at zero for standard gloves','Use only for the knot styles named in the order specification']},aDo:'Wrong-zone knotting shows as hard lumps inside the glove — revert to zero if lumps appear.'},
  {p:1,n:'Tool — Blow Set',v:'mode',k:'tech',what:'Air-blow editing mode — sets air blowing per zone to clear lint and cut yarn ends from the knitting area.',a:{t:'When to use it',items:['Keep ON for lint-prone zones — wrist edge and dark yarn jobs','OFF where air disturbs very light yarns or wastes air capacity']},aDo:'If lint builds up at the wrist edge between pieces, enable blow for the wrist and cuff zones.'},
  {p:1,n:'Tool — Head Location',v:'mode',k:'tech',what:'Fine position offsets of the knitting head per zone — used to align pattern features with the physical needles.',a:{t:'When this is wrong',items:['Pattern features shift a stitch left or right — fingers or seam off-centre','Usually only drifts after head motor, belt or home-sensor service']},aDo:'Technician / pattern-file value — restore the recorded offsets after any head service; never tune by eye during production.'},
  {p:1,n:'Tool — Other Parameters',v:'mode',k:'tech',what:'Collects the remaining per-zone parameters that do not have their own button — advanced settings grouped for the pattern programmer.',a:{t:'When to change',items:['Only per the pattern documentation for a specific glove style','Random changes here produce defects that are hard to trace — treat this area like a pattern file']},aDo:'Back up current values before editing; restore immediately if piece quality changes.'},
  {p:1,n:'Mitten types — Intact buttons',v:'6 x Intact',k:'tech',what:'The six Intact buttons set each finger and thumb section either closed (Intact) or open with a hole, depending on the glove style being knitted.',a:{t:'When to use them',items:['Set every section to match the style drawing on the order sheet — one wrong section means a full batch of the wrong style','All Intact (current) is correct for standard closed gloves']},aDo:'After changing any section, run one piece and check every finger against the spec before continuing.'},
  {p:1,n:'Mitten laps',v:'66',k:'num',unit:'laps',what:'Total number of courses (laps) the machine knits for the mitten-type section when a mitten style is selected. Not used for standard five-finger gloves.',a:{t:'Value too HIGH',items:['Mitten section too long — proportions wrong, wasted yarn']},aDo:'Decrease toward the style card value if the section overruns its target length.',b:{t:'Value too LOW',items:['Mitten section too short — does not cover the hand as specified']},bDo:'Increase toward the card value if the section comes up short.'}
,

  {p:2,n:'Density table — row numbers (1–10 here, 11–20 on Next)',v:'20 rows',k:'tech',what:'Twenty programmable density segments per bed — rows 1–10 shown on this screen, rows 11–20 on the Next screen. Use Next and Prev to move between the two screens. Each segment defines one row range of the glove and the density knitted inside it.',a:{t:'How to use the rows',items:['Use one row per region that needs its own density — example: wrist rows 40–60 at value 30','Leave unused rows at 0 — the machine ignores them','Program matching regions on Front and Rear unless the style deliberately differs']},aDo:'Plan the segments on paper from the pattern card before entering them — random entries show as visible density bands on the glove.'},
  {p:2,n:'Active row 1 — Front density',v:'rows 1–2 · 7',k:'num',unit:'density',what:'The first two courses of each piece knit at front-bed density 7 — tighter than the surrounding zones, anchoring the cast-on so the start does not ladder.',a:{t:'Value 7 too HIGH for the start',items:['First rows too tight — cast-on edge puckers or curls','Yarn breaks at the very start where tension is already highest']},aDo:'Decrease toward the zone value if the edge curls or start breaks occur; 7 is mild and usually safe.',b:{t:'Value 7 too LOW',items:['Start rows loose — ladders or open loops at the beginning of the piece','First courses snag during the overlock pass']},bDo:'Increase toward 7–8 if the first rows look loose compared with the rest of the glove.'},
  {p:2,n:'Active row 1 — Rear density',v:'rows 1–2 · 10',k:'num',unit:'density',what:'The same first two courses knit at rear-bed density 10 — noticeably tighter than the front (7), holding the start rows firmly on both beds.',a:{t:'Value 10 too HIGH for the start',items:['Start over-tightened — edge curls toward the back, tension marks','Snapped yarn in the first two courses increases']},aDo:'Decrease toward 7–8 if you see start-of-piece breaks or a curled edge; keep the rear equal to or slightly above the front.',b:{t:'Value 10 too LOW',items:['Rear start rows looser than front — the piece twists or the cast-on skews','First loops unstable, dropped stitches at the very start']},bDo:'Increase back toward 10 if the start of the piece skews or twists.'},
  {p:2,n:'Why rear 10 differs from front 7',v:'3 steps tighter',k:'tech',what:'The rear bed is set 3 density steps tighter than the front for the first two rows — a common start anchor, because the rear bed carries the cast-on and needs the extra hold.',a:{t:'When the difference is wrong',items:['Rear much tighter than this — start curls hard to one side, breaks at cast-on','Rear equal to front — the start can skew or ladder on slippery yarn']},aDo:'Keep the rear 2–4 steps above the front for these two rows; change both together only if the whole start changes character.'},
  {p:2,n:'Button — Delete All',v:'clears table',k:'tech',what:'Clears every Start Row, End Row and Density Value in the table in one action.',a:{t:'When to use it',items:['When switching to a style that needs no table control at all','Before entering a completely new set of segments — safer than editing over old rows']},aDo:'There is no undo — photograph or write down active rows (like row 1: front 1–2@7, rear 1–2@10) before deleting.'},
  {p:2,n:'Button — Copy All',v:'copies front→rear',k:'tech',what:'Copies the Front Density half into the Rear Density half so both beds carry identical segments.',a:{t:'When to use it',items:['After programming the front half, copy then adjust only the rows that must differ — like row 1 here','Also used to return both halves to equal after a trial change']},aDo:'After copying, re-check rows that are meant to differ — Copy All overwrites them.'},
  {p:2,n:'Column — Start Row',v:'0',k:'num',unit:'row',what:'The first course of the piece where this segment density applies.',a:{t:'Value too HIGH',items:['Tightening starts after the target region — the first courses of that region knit at the old, looser density','If set beyond the End Row the segment never activates']},aDo:'Decrease the Start Row until it lands exactly on the first course of the region; it must be smaller than the End Row.',b:{t:'Value too LOW',items:['Density change begins too early — extra courses knit tighter than intended','Yarn breaks or gauge marks appear before the real region starts']},bDo:'Increase the Start Row to the true first course of the region.'},
  {p:2,n:'Column — End Row',v:'0',k:'num',unit:'row',what:'The last course of the piece where this segment density applies. Together with Start Row it brackets the region.',a:{t:'Value too HIGH',items:['Tighter (or looser) knitting continues past the region into the next one','Overlaps the next segment — the transition between regions becomes messy']},aDo:'Decrease the End Row to the true last course of the region; keep segments non-overlapping.',b:{t:'Value too LOW',items:['Region only partly covered — the far end of the zone knits at default density','Visible density step mid-region']},bDo:'Increase the End Row until the whole region is covered; it must be larger than the Start Row.'},
  {p:2,n:'Column — Density Value',v:'0',k:'num',unit:'density',what:'The stitch density knitted between Start Row and End Row. Higher number = tighter fabric, lower = looser.',a:{t:'Value too HIGH',items:['Fabric in the range very tight — glove fits small there','Yarn breakage rises inside the segment','Visible gauge step against neighbouring regions']},aDo:'Decrease toward the surrounding zone values — move in steps of 1–2 and re-measure.',b:{t:'Value too LOW',items:['Segment knits looser than intended — baggy band, wrinkles','Tension imbalance can drop stitches at the segment edges']},bDo:'Increase toward the pattern-card value for that region.'},
  {p:2,n:'Rows 2–20 are zero — only row 1 is programmed',v:'1 active row',k:'tech',what:'Row 1 is the only active segment on this machine: Front knits rows 1–2 of every piece at density 7, Rear knits rows 1–2 at density 10. Every other row is 0 and ignored.',a:{t:'What this means on the glove',items:['Only the first two courses of each piece get table-controlled density — everything after row 2 follows the drawing zone values on page 1','The remaining 19 rows are spare — fill them only if a region needs its own density']},aDo:'When adding a segment, fill Start Row, End Row and Density Value together — a half-filled row does nothing. Test one piece at first-run speed after any change.'},
  {p:2,n:'Front Density vs Rear Density halves',v:'two tables',k:'tech',what:'The left half programs the front bed density, the right half the rear bed density. Both beds knit the same glove, so normally both halves carry identical values.',a:{t:'When to set them differently',items:['Only for styles that deliberately differ face vs back — per the pattern documentation','A difference entered by mistake shows as uneven tension, curling or a misshaped palm']},aDo:'If in doubt, copy the Front values into the Rear half — equal is the safe default.'},
  {p:2,n:'How the table works with the drawing zones',v:'priority',k:'tech',what:'Wherever a table row is active (non-zero), its Density Value overrides the zone value from the drawing for those rows. Where no row is active, the zone value rules.',a:{t:'Keep them consistent',items:['Do not fight the zones — a table row slightly different from its zone gives a small step; very different gives a visible band','Delete a row by zeroing its three values when the region should follow the zone again']},aDo:'After editing, knit one piece and flex the region — feel for stiff bands before restarting production.'}
,

  {p:3,n:'Sub yarn table — what it does',v:'10 rows shown',k:'tech',what:'Programs where the reinforcement (sub) yarn is knitted: each row defines a row range (Start Row → End Row), which sub yarn feeder is used (Sub Yarn Number), and whether the yarn ends are locked at the segment boundaries. All values are 0 — the table is inactive, matching sub yarn function OFF.',a:{t:'How to fill it',items:['Fill rows only for orders with reinforced zones — typically palm and/or cuff','Enter Start Row, End Row and Sub Yarn Number together; a half-filled row does nothing','Lock yarn ends at the beginning and end when the tail must not pull out']},aDo:'Photograph the table before changing it; after any change, knit one piece and check the reinforced zone and the yarn ends.'},
  {p:3,n:'Column — Start Row / End Row',v:'0',k:'num',unit:'row',what:'The first and last course of the piece where this sub yarn segment is active — same meaning as in the density table on page 2.',a:{t:'Rows wrong',items:['Start after the zone — reinforcement begins late, the first rows of the zone are single yarn','End before the zone — the tail of the zone is unprotected','Overlapping segments — the feeder switches twice and the overlap knits heavy']},aDo:'Set Start and End to bracket exactly the zone from the pattern card, and keep segments non-overlapping.'},
  {p:3,n:'Column — Sub Yarn Number',v:'0',k:'num',unit:'feeder',what:'Which sub yarn feeder knits this segment — 1 = first sub yarn, 2 = second (if fitted). 0 = no sub yarn in this row range.',a:{t:'Value too HIGH / wrong feeder',items:['A feeder number the machine does not have fitted → alarms, segment never knits','Wrong feeder on a two-yarn system → the reinforcement uses the wrong yarn and the whole zone fails inspection']},aDo:'Use 1 for the standard feeder; use 2 only if a second sub yarn system is fitted — check the machine specification first.',b:{t:'Value 0',items:['No reinforcement — correct for standard gloves','Reinforced orders will come out single-yarn if left at 0']},bDo:'For reinforced orders set the feeder number the spec sheet names, together with Start and End rows.'},
  {p:3,n:'Column — Lock Yarn Ends at The Beginning',v:'0',k:'num',unit:'0/1',what:'Locks (tacks) the sub yarn end at the start of the segment so the tail cannot slip or pull back out. 0 = off, 1 = on.',a:{t:'Locked (1) when not needed',items:['Small tack visible at the segment start','Slightly longer cycle time']},aDo:'Set 0 when the zone is knitted continuously and the start is captured by surrounding courses.',b:{t:'Not locked (0) when needed',items:['Sub yarn tail works loose after washing or flexing','A loose tail inside the glove irritates the hand and fails inspection']},bDo:'Set 1 whenever the segment start is a true beginning of sub yarn use, or the order spec asks for locked ends.'},
  {p:3,n:'Column — Lock Yarn Ends at The End',v:'0',k:'num',unit:'0/1',what:'Locks the sub yarn end at the end of the segment — the cut-off tail is secured instead of hanging free.',a:{t:'Locked (1) when not needed',items:['Unnecessary tack and cycle time at the segment end']},aDo:'Set 0 when the next section continues over the end and captures the tail anyway.',b:{t:'Not locked (0) when needed',items:['Sub yarn end frays or pulls out at the zone boundary','Tail sticks out of the fabric on the inside of the glove']},bDo:'Set 1 on the last sub yarn segment of the piece and wherever the spec requires secured ends.'},
  {p:3,n:'All zeros — sub yarn currently unused',v:'inactive',k:'tech',what:'Every row is 0, so no sub yarn is knitted anywhere — consistent with sub yarn function OFF on page 6 and sub scissors OFF. Standard single-yarn production.',a:{t:'Before enabling sub yarn anywhere',items:['Turn ON sub yarn function and sub scissors, or the table rows will not knit','Check the sub yarn path, tension and scissors cut before the first piece','Enter table rows and zone settings together — one without the other gives no reinforcement']},aDo:'Run the first reinforced piece at first-run speed and pull-test the reinforced zone and both yarn ends.'},
  {p:3,n:'Buttons — Delete All, Aux Set, Sub Sci',v:'3 buttons',k:'tech',what:'Delete All clears the whole table (no undo — record active rows first). Aux Set opens auxiliary sub yarn parameters (tension and timing of the feeder — technician values). Sub Sci jumps to the sub scissors settings, which must be active for the sub yarn to be cut cleanly.',a:{t:'When to use each',items:['Delete All — when switching to a style with no sub yarn','Aux Set — only with the sub yarn system documentation in hand','Sub Sci — to verify or adjust the cut of the sub yarn ends']},aDo:'Treat Aux Set values like calibration data: restore recorded values after any feeder service.'}
,

  {p:4,n:'Knot table — what it does',v:'20 rows',k:'tech',what:'Programs where knots are tied inside the glove for styles that need them (decorative or functional knots). Each row gives the course where the knot happens (Knot Row), which yarn is tied (Yarn Number), and a fine position offset (Adjustment). All values are 0 — no knots are programmed, matching knotting function 0 on page 7.',a:{t:'How to use it',items:['Fill a row only when the order style calls for a knot at a specific course','Knot Row, Yarn Number and Adjustment work as a set — a half-filled row does nothing','Use Next and Prev to move between the two halves of the table (rows 1–10 and 11–20)']},aDo:'Photograph the table before changing it; after any change, knit one piece and check the knot sits exactly on the target course.'},
  {p:4,n:'Column — Knot Row',v:'0',k:'num',unit:'row',what:'The course (row) of the piece where the knotter ties a knot. 0 = no knot in that row entry.',a:{t:'Value too HIGH',items:['Knot lands past the target zone — inside the wrong section of the glove','If beyond the piece length, the knot never happens and the row is wasted']},aDo:'Decrease until the knot lands on the target course from the pattern card.',b:{t:'Value too LOW',items:['Knot tied too early — inside the previous section','Multiple close knots make a hard, uncomfortable lump band']},bDo:'Increase to the exact target course; space knots per the style spec.'},
  {p:4,n:'Column — Yarn Number',v:'0',k:'num',unit:'yarn',what:'Which yarn the knot is tied on — 1 = main yarn, 2 = sub yarn (when fitted). 0 = no knot.',a:{t:'Wrong yarn number',items:['Knot tied on the wrong yarn — it works loose because that yarn is not carried there','A number with no such yarn fitted → alarms or the row is skipped']},aDo:'Use 1 for knots in the main yarn — the standard case; use 2 only when the style ties off the sub yarn.'},
  {p:4,n:'Column — Adjustment',v:'0',k:'num',unit:'offset',what:'Fine offset of the knot position around the Knot Row — shifts the tie by a small amount when the knot lands a course or two off target.',a:{t:'Value too HIGH',items:['Knot drifts past the intended position by the offset amount','Stacked with a wrong Knot Row, pushes the knot into the wrong section']},aDo:'Return to 0 and correct the Knot Row itself; use Adjustment only for one-course fine tuning.',b:{t:'Value too LOW (negative)',items:['Knot moves before the target course']},bDo:'Keep at 0 unless a one-course shift is documented on the pattern card.'},
  {p:4,n:'All zeros — knotting currently unused',v:'inactive',k:'tech',what:'Every row is 0, so the knotter never fires — consistent with knotting function 0 on page 7. Standard production ties off yarn by overlocking instead of knots.',a:{t:'Before enabling knots',items:['Set knotting function on page 7 to match the number of wraps the style needs','Clean and test the knotter blades on waste yarn first','Enter Knot Row and Yarn Number together, then test one piece at first-run speed']},aDo:'Knots that slip or jam usually mean dirty knotter blades — clean them before changing table values.'}
,

  {p:5,n:'Blow table — what it does',v:'10 rows',k:'tech',what:'Programs exactly where the air blow fires during each piece — each row gives a row range (Start Row → End Row) and whether the blow is ON (1) or OFF (0) inside it. Row 1 is active: the blow fires on rows 3–8; all other rows are 0 and ignored.',a:{t:'How to read this table',items:['Row 1: blow ON from course 3 to course 8 — the machine clears lint and cut ends through the early body of the piece','Rows 1–2 and everything after course 8 get no blow — the cast-on and the wrist/seal area are left alone','Add more rows only if another zone needs its own blow timing']},aDo:'Keep unused rows at 0; photograph the table before changing it.'},
  {p:5,n:'Column — Start Row (set to 3)',v:'3',k:'num',unit:'row',what:'The first course where this blow row becomes active. Set to 3 here so the first two courses — the cast-on — are not disturbed by air.',a:{t:'Value too HIGH',items:['Blow starts late — lint and yarn ends accumulate in the early courses','If set past the End Row the row never fires']},aDo:'Decrease toward 3 unless the cast-on proves unstable under blow; rows 1–2 are usually best kept unblown.',b:{t:'Value too LOW (1–2)',items:['Air hits the cast-on — first loops can lift or shift, start becomes unstable','Light yarns blow around and tangle at the very start']},bDo:'Increase back to 3 if start quality drops after blow changes.'},
  {p:5,n:'Column — End Row (set to 8)',v:'8',k:'num',unit:'row',what:'The last course where this blow row stays active.',a:{t:'Value too HIGH',items:['Blow continues past the intended zone — wasted air, light yarns disturbed near the wrist and seal']},aDo:'Decrease the End Row until the blow stops where the zone ends.',b:{t:'Value too LOW',items:['Only part of the zone is cleared — lint remains and gets knitted in further down']},bDo:'Increase the End Row until the whole target zone is covered; keep it below the wrist/seal region unless that area needs blowing.'},
  {p:5,n:'Column — Blow (1 = ON, 0 = OFF)',v:'1',k:'num',unit:'0/1',what:'Whether the air blow is ON (1) or OFF (0) inside the row range. Row 1 is ON for rows 3–8.',a:{t:'ON where it should be OFF',items:['Air wastes on zones that do not need it','Very light or hairy yarns fly and tangle; elastic yarns can be pushed off position']},aDo:'Set 0 for zones that knit light, elastic or already-clean yarn.',b:{t:'OFF where it should be ON',items:['Lint and cut ends accumulate — dropped stitches, dirty-looking fabric, sensor false alarms from debris']},bDo:'Set 1 with a Start/End range covering exactly the lint-prone courses.'},
  {p:5,n:'Why rows 1–2 and the wrist are not blown',v:'design',k:'tech',what:'The program blows only courses 3–8. The cast-on (rows 1–2) needs a still start so the first loops seat properly, and the wrist/seal area is handled by the overlock hardware — blowing there disturbs the elastic position more than it helps.',a:{t:'If you change this pattern',items:['Extending blow toward row 1 can destabilise the cast-on — watch the first rows closely','Adding a blow zone near the wrist can move elastic — verify wrist tension after any change']},aDo:'Treat rows 3–8 as the proven safe window; widen it only after a test piece passes inspection.'},
  {p:5,n:'Button — Delete All',v:'clears table',k:'tech',what:'Clears all Start Row, End Row and Blow values in one action. No undo.',a:{t:'When to use it',items:['When switching yarn types — e.g. from a lint-heavy yarn to a clean smooth yarn that needs no programmed blow','Before entering a completely new blow program']},aDo:'Record row 1 (3–8, ON) before deleting so it can be restored exactly.'}
,

  {p:6,n:'Head location table — what it does',v:'10 rows',k:'tech',what:'Programs fine left/right position offsets of the knitting head for specific row ranges of the piece. Each row brackets a range (Start Row → End Row) and shifts the head left or right within it to align pattern features exactly with the physical needles. All values are 0 — no offsets are programmed.',a:{t:'How to use it',items:['Use only when a pattern feature must sit a needle or two off its natural position — e.g. aligning a mark with the seam','Head Left and Head Right are used one at a time per row — a row normally carries a value in only one of them','Keep unused rows at 0']},aDo:'These are pattern-programmer values — restore from the pattern file or recorded backup after any change, and verify with one test piece.'},
  {p:6,n:'Column — Start Row / End Row',v:'0',k:'num',unit:'row',what:'The first and last course where this head-offset row is active — same meaning as in the other tables on pages 2–5.',a:{t:'Rows wrong',items:['Offset starts late — the first courses of the feature sit at the natural position','Offset ends early — only part of the feature is shifted','Overlapping rows with opposite offsets — the head fights itself and alarms']},aDo:'Bracket exactly the courses of the feature and keep rows non-overlapping.'},
  {p:6,n:'Column — Head Left',v:'0',k:'num',unit:'offset',what:'Shifts the knitting head to the left by this amount throughout the row range.',a:{t:'Value too HIGH',items:['Pattern shifts too far left — features misalign to the left of the seam or fingers','Carriage travels closer to its left limit — risk of end-stop crashes on wide pieces']},aDo:'Decrease the offset; most corrections need only 1–2 steps.',b:{t:'Value too LOW for the need',items:['Feature still sits right of its intended position by the remaining error']},bDo:'Increase 1 step at a time and check the feature position on a test piece.'},
  {p:6,n:'Column — Head Right',v:'0',k:'num',unit:'offset',what:'Shifts the knitting head to the right by this amount throughout the row range — the mirror of Head Left.',a:{t:'Value too HIGH',items:['Pattern shifts too far right — mirrored version of the left-offset faults','Right end-stop crash risk on wide pieces']},aDo:'Decrease the offset; combine with Head Left only if the pattern documentation says so.',b:{t:'Value too LOW for the need',items:['Feature remains left of its target']},bDo:'Increase 1 step at a time, verifying on a test piece.'},
  {p:6,n:'All zeros — no head offsets',v:'inactive',k:'tech',what:'Every row is 0, so the head knits at its natural position across the whole piece — the normal state for standard patterns.',a:{t:'When to add offsets',items:['Only when a style drawing shows a feature that must sit off the natural needle position','After any head motor, belt, or home-sensor service that could have shifted the reference — restore the recorded offsets instead of re-measuring']},aDo:'If the whole pattern shifted uniformly, the cause is mechanical (home position) — fix that first instead of patching with this table.'},
  {p:6,n:'Button — Delete All',v:'clears table',k:'tech',what:'Clears every Start Row, End Row, Head Left and Head Right value in one action. No undo.',a:{t:'When to use it',items:['When switching back to standard patterns that need no head offset','Before loading a completely new set of offsets']},aDo:'Photograph or write down any active rows first so they can be restored exactly.'}
,
  {p:7,n:'Slots number',v:'52',k:'tech',unit:'slots',what:'Number of active knitting slots the control maps for this pattern. It defines how the carriage addresses the needle bed for this glove model.',a:{t:'When this value is wrong',items:['Set lower than actual — pattern squeezed, fingers and palm misaligned','Set higher than actual — empty slots snag yarn, drop stitches, constant alarms']},aDo:'Do not tune by trial. Copy this value from the pattern card / spec sheet for this glove model and machine gauge.'},
  {p:7,n:'Angle at which the hook blade hooks down',v:'185',k:'tech',unit:'deg',what:'Cam angle where the overlock hook blade swings down to catch the yarn. Part of the hook trajectory calibration.',a:{t:'When this value is wrong',items:['Hook misses the yarn — overlock seam does not start','Hook hits the blade or needle — damaged hooks, broken needles','Yarn chewed or frayed at the wrist edge']},aDo:'Technician calibration only. Restore the recorded value after any hook, blade or cam service — never adjust to chase a quality symptom.'},
  {p:7,n:'Angle at which the scissors cut the yarn',v:'90',k:'tech',unit:'deg',what:'Cam angle at which the scissors close to cut the yarn. Timing must match yarn position exactly.',a:{t:'When this value is wrong',items:['Yarn not cut — tails drag into the next course','Yarn cut too early — frayed ends, uncaptured tail']},aDo:'Technician set. Check blade sharpness and clearance first — a dull blade mimics a timing fault.'},
  {p:7,n:'Distance run by the fork motor circle',v:'32',k:'tech',unit:'distance',what:'Travel distance of the yarn-fork servo during its working cycle — how far the fork moves to present the yarn.',a:{t:'When this value is wrong',items:['Fork stops short — yarn not presented, feeding misses','Fork travels too far — yarn pulled off the feeder or stretched']},aDo:'Restore from machine records after fork motor or linkage service.'},
  {p:7,n:'Distance run by the scissors motor circle',v:'32',k:'tech',unit:'distance',what:'Travel distance of the scissors servo during its working cycle.',a:{t:'When this value is wrong',items:['Scissors do not fully close — incomplete cut','Over-travel — mechanical shock, blade damage']},aDo:'Restore from machine records after scissors motor or linkage service.'},
  {p:7,n:'Starting position for releasing elastic yarn',v:'262',k:'tech',unit:'position',what:'Servo position where elastic release begins. Together with the ending position it defines how much elastic is fed.',a:{t:'When this value is wrong',items:['Release starts too early or too late — wrist elastic uneven around the cuff','Together with a wrong end position: elastic too long (loose cuff) or too short (tight cuff)']},aDo:'Change only together with the ending position as a pair, and verify by measuring the elastic length in the wrist.'},
  {p:7,n:'Ending position for releasing elastic yarn',v:'240',k:'tech',unit:'position',what:'Servo position where elastic release ends. The fed elastic length = start (262) minus end (240).',a:{t:'When this value is wrong',items:['Gap too big — too much elastic, loose wavy cuff','Gap too small — elastic overstretched, tight wrist, snapping elastic']},aDo:'Adjust in small steps with the starting position; test one glove and check wrist stretch before resuming production.'},
  {p:7,n:'Fork alarm deviation',v:'5',k:'num',unit:'deviation',what:'How far the yarn fork is allowed to drift from its target position before the machine alarms and stops.',a:{t:'Value too HIGH',items:['Real feeding faults pass unnoticed — missed yarn runs many courses','Gradual mechanical wear silently degrades quality']},aDo:'Decrease to 3–4 if feeding faults are being missed or quality drifts between checks.',b:{t:'Value too LOW',items:['Vibration and normal play trip false alarms','Machine stops repeatedly for no real fault — lost production']},bDo:'Increase to 6–8 if false fork alarms dominate; clean and tighten the fork mechanism first.'},
  {p:7,n:'Depth of front press needle',v:'18',k:'num',unit:'depth',what:'How deep the front presser pushes needles into the work during formation and transfer.',a:{t:'Value too HIGH',items:['Needles bent or hooks damaged','Fabric marks, presser lines on the palm']},aDo:'Decrease toward 15–16 if needles bend or the palm shows press marks; check presser alignment first.',b:{t:'Value too LOW',items:['Skipped stitches and floats — needles not properly pressed','Loops and ladders in the fabric']},bDo:'Increase toward 18–20 if stitches skip with a healthy presser; verify with a slow first run.'},
  {p:7,n:'Depth of rear press needle',v:'18',k:'num',unit:'depth',what:'Same press depth setting for the rear bed, used at the palm and half-needle sections.',a:{t:'Value too HIGH',items:['Bent rear needles — holes appear exactly at the palm taper','Density marks on the back of the glove']},aDo:'Decrease slightly if rear needles bend or marks show; rear bed is less visible — inspect deliberately.',b:{t:'Value too LOW',items:['Rear bed drops stitches — ladders at the small palm','Half-needle sections do not form cleanly']},bDo:'Increase toward 18–20 if ladders appear at the taper with good needles.'},
  {p:7,n:'Oiling interval',v:'150',k:'num',unit:'min',what:'Minutes between automatic lubrication cycles. The machine oils itself on this timer during production.',a:{t:'Value too HIGH (long interval)',items:['Dry needle hooks and cams — noise, heat, premature wear','More needle breakage in long continuous runs']},aDo:'Decrease toward 90–120 minutes in dusty, hot conditions or with long uninterrupted runs.',b:{t:'Value too LOW (short interval)',items:['Excess oil consumption, oil mist on yarn and floor','Oil stains on light-coloured gloves']},bDo:'Increase toward 150–180 if oil consumption is high and the environment is clean and cool.'},
  {p:7,n:'Oiling time',v:'4',k:'num',unit:'s',what:'How many seconds the oil pump runs at each automatic oiling.',a:{t:'Value too HIGH',items:['Oil drips and pools — first gloves after oiling show stains','Wasted oil, slippery floor around the machine']},aDo:'Decrease to 3 s if staining appears; check that oil lines are not blocked causing over-feed at the pump.',b:{t:'Value too LOW',items:['Oil does not reach far ends of the needle bed — dry spots','Squeaking or rising noise a few hours after oiling']},bDo:'Increase to 4–5 s if dry spots or noise return quickly; verify oil level and line flow first.'},
  {p:7,n:'Screen off time',v:'1',k:'num',unit:'min',what:'Minutes of no touch before the operator screen dims or sleeps. Display convenience only — does not affect knitting.',a:{t:'Value too HIGH',items:['Screen stays on — panel wears faster, distractions at night']},aDo:'Decrease to 1–3 min for panel life; any tap wakes it instantly.',b:{t:'Value too LOW',items:['Screen sleeps while the operator is watching production across the room']},bDo:'Increase to 3–5 min if the screen keeps dimming during normal monitoring.'},
  {p:7,n:'Accumulated production',v:'46202',k:'tech',unit:'pieces',what:'Lifetime counter of gloves produced by this machine. Information only — used for maintenance scheduling and output tracking.',a:{t:'How to use it',items:['Plan needle, cam and belt replacements against this counter per the maintenance schedule','Sudden resets indicate a control battery or memory issue — record the value daily']},aDo:'Never edit. Log it at each shift for production records.'},
  {p:7,n:'Front press needle unit speed',v:'300',k:'num',unit:'speed',what:'Servo speed of the front presser unit — how fast the presser moves into and out of the needles.',a:{t:'Value too HIGH',items:['Presser overshoots — needle shock, bent needles','Mechanical impact noise, faster wear of the presser cam']},aDo:'Decrease toward 250 if you hear impact noise or see bent needles with correct depth.',b:{t:'Value too LOW',items:['Presser arrives late — stitches skip at high production speed','Cycle time creeps up']},bDo:'Increase toward 300–350 only if press timing lags at full speed.'},
  {p:7,n:'Front density unit speed',v:'300',k:'num',unit:'speed',what:'Servo speed of the front density cam — how fast stitch length changes are executed.',a:{t:'Value too HIGH',items:['Density steps arrive with a snap — visible gauge marks at transitions','Cam mechanism wear']},aDo:'Decrease toward 250 if marks appear at density change points.',b:{t:'Value too LOW',items:['Slow density response — the section ends before density settles','Wrist density does not reach target on short sections']},bDo:'Increase toward 300–350 if wrist density lags the pattern.'},
  {p:7,n:'Rear press needle unit speed',v:'300',k:'num',unit:'speed',what:'Servo speed of the rear presser unit — same role as the front presser on the back bed.',a:{t:'Value too HIGH',items:['Rear needle shock and bending — ladders at the palm taper follow']},aDo:'Decrease toward 250 if rear needles bend or impact noise comes from the back.',b:{t:'Value too LOW',items:['Rear press timing lags — skipped stitches at the half-needle sections']},bDo:'Increase toward 300–350 only after the rear presser mechanism is confirmed healthy.'},
  {p:7,n:'Rear density unit speed',v:'300',k:'num',unit:'speed',what:'Servo speed of the rear density cam, controlling back-bed stitch length changes.',a:{t:'Value too HIGH',items:['Gauge marks on the back of the glove at density transitions']},aDo:'Decrease toward 250 if back-face marks appear at the wrist or taper.',b:{t:'Value too LOW',items:['Rear density lags the pattern — uneven fabric tension, misshaped palm']},bDo:'Increase toward 300–350 if rear density does not settle within its section.'},
  {p:7,n:'Fork motor speed',v:'300',k:'num',unit:'speed',what:'Servo speed of the yarn fork — how fast the fork moves to present and withdraw the yarn.',a:{t:'Value too HIGH',items:['Fork overshoots — yarn thrown off or double-presented','Wear on the fork linkage']},aDo:'Decrease toward 250 if the fork overshoots or feeding becomes erratic at high speed.',b:{t:'Value too LOW',items:['Fork arrives late — yarn presented after the needles pass','Missed feeding at full production speed']},bDo:'Increase toward 300–350 if feeding misses only appear at maximum speed.'},
  {p:7,n:'Scissors motor speed',v:'300',k:'num',unit:'speed',what:'Servo speed of the scissors unit — how fast the blades open and close.',a:{t:'Value too HIGH',items:['Cut happens with shock — yarn pushed away instead of cut, frayed ends','Blade edge chips over time']},aDo:'Decrease toward 250 if ends fray or the cut timing feels violent.',b:{t:'Value too LOW',items:['Blades close too slowly — yarn drags before cutting, tails stretched']},bDo:'Increase toward 300–350 if cuts are incomplete at high speed with sharp blades.'},
  {p:8,n:'Main scissors speed',v:'200',k:'num',unit:'speed',what:'Running speed of the main scissors servo during the cut sequence at the wrist.',a:{t:'Value too HIGH',items:['Cut shock — yarn pulled before it is cut, frayed or stretched tails','Blade and linkage wear increases']},aDo:'Decrease toward 150–180 if ends fray or the mechanism bangs.',b:{t:'Value too LOW',items:['Cut sequence takes too long — wrist section becomes the bottleneck','Yarn can slip out of the blades before they close']},bDo:'Increase toward 200–250 once cuts are clean at current speed.'},
  {p:8,n:'Sub scissors speed',v:'200',k:'num',unit:'speed',what:'Running speed of the sub scissors that cut the secondary (sub) yarn.',a:{t:'Value too HIGH',items:['Sub yarn cut shock — the fine sub yarn frays or slips out of position']},aDo:'Decrease toward 150–180 if the sub yarn end frays after cutting.',b:{t:'Value too LOW',items:['Sub yarn cut lags — it gets carried into the next course and tangles']},bDo:'Increase toward 200–250 if sub yarn tails appear where they should have been cut.'},
  {p:8,n:'Cylinder speed (finger)',v:'400',k:'num',unit:'speed',what:'Rotation speed of the pattern cylinder (dial) while knitting the finger sections, where needle selection changes most often.',a:{t:'Value too HIGH',items:['Cylinder overshoots its target position — wrong needles selected','Finger sections knit with mixed selections — distorted fingers, alarms']},aDo:'Decrease toward 350 if finger sections show selection errors or cylinder position alarms.',b:{t:'Value too LOW',items:['Cylinder cannot complete its rotation within the finger section','Selection runs into the next section — pattern smears across finger roots']},bDo:'Increase toward 400–450 only if selection timing lags at high speed.'},
  {p:8,n:'Cylinder speed (palm)',v:'300',k:'num',unit:'speed',what:'Rotation speed of the pattern cylinder while knitting the palm and wrist, where selection changes are less frequent.',a:{t:'Value too HIGH',items:['Unnecessary shock on the cylinder drive — wear without any speed benefit','Overshoot at the few palm selections that do change']},aDo:'Keep at or below 300; the palm does not need finger-section speed.',b:{t:'Value too LOW',items:['Palm selections lag — density and half-needle selections land one course late']},bDo:'Increase toward 300–350 if palm selections visibly lag the pattern.'},
  {p:8,n:'Front rod sealing position',v:'10',k:'tech',unit:'position',what:'Stop position of the front sealing rod — where the rod rests to hold the work during the overlock seal.',a:{t:'When this value is wrong',items:['Seal forms away from the edge — skipped or floating overlock stitches','Rod presses into the needles — bent needles, marks on the wrist']},aDo:'Technician set after any rod, bearing or seal-head service. Do not adjust to chase seam quality — check rod wear and alignment first.'},
  {p:8,n:'Rear rod sealing position',v:'4',k:'tech',unit:'position',what:'Stop position of the rear sealing rod, paired with the front rod during the seal.',a:{t:'When this value is wrong',items:['Rear support missing during seal — the wrist edge vibrates and the seam skips','Rear rod contacts needles — damage on the back of the wrist edge']},aDo:'Technician set together with the front rod. The pair must be calibrated as a set.'},
  {p:8,n:'Fork homing distance',v:'3.5',k:'tech',unit:'distance',what:'Distance the fork servo travels toward its home sensor when finding the reference position at start-up.',a:{t:'When this value is wrong',items:['Fork cannot find home — machine refuses to start, homing alarms','Fork references against the wrong edge — all feeding positions drift']},aDo:'Restore the factory value after fork servo, belt or sensor replacement. Never use it to correct feeding symptoms.'},
  {p:8,n:'Scissors homing distance',v:'6.5',k:'tech',unit:'distance',what:'Distance the scissors servo travels to find its home sensor at start-up.',a:{t:'When this value is wrong',items:['Scissors homing faults at power-up','All cut positions drift — cuts land early or late across the whole cycle']},aDo:'Restore the factory value after scissors servo or sensor service.'},
  {p:8,n:'Head version',v:'2',k:'tech',unit:'version',what:'Hardware version of the knitting head installed on this machine. The control uses it to select correct motion parameters.',a:{t:'When this value is wrong',items:['Wrong version → head moves with mismatched timings — crashes, mis-knits, alarms','Usually only wrong after a head replacement or control board swap']},aDo:'Match it to the label on the physical head. If in doubt after a repair, confirm with the technician who did the swap.'},
  {p:8,n:'Head homing distance',v:'1',k:'tech',unit:'distance',what:'Reference approach distance the knitting head uses when finding its home position.',a:{t:'When this value is wrong',items:['Head homing faults or slow homing at start-up','Head position drifts — pattern start point wanders between pieces']},aDo:'Restore the factory value after head motor, belt or home-sensor service.'},
  {p:8,n:'Cylinder location when knitting first row of little finger with sub yarn set',v:'0',k:'tech',unit:'position',what:'Cylinder position offset used for the first little-finger row when sub yarn is active — aligns the sub-yarn selection with that row.',a:{t:'When this value is wrong',items:['Sub yarn appears one row early or late at the little finger','Reinforced row lands in the wrong place on gloves with sub yarn']},aDo:'Keep at 0 unless the pattern documentation for a sub-yarn style specifies an offset; restore from pattern file if corrupted.'},
  {p:8,n:'Cylinder location when idling the first row',v:'51',k:'tech',unit:'position',what:'Cylinder position used during the empty idling rows at the start, before real knitting begins.',a:{t:'When this value is wrong',items:['Idling rows knit with wrong needle selection — the chain tangles or snags','Transition from idling to first real row is rough — yarn jumps']},aDo:'Normally never changed. If start-up behaviour changed after a cylinder service, restore the recorded value.'},
  {p:8,n:'Sub scissors releasing yarn angle (v0)',v:'0',k:'tech',unit:'deg',what:'Base angle of the sub scissors when releasing the sub yarn — the starting point of its release motion.',a:{t:'When this value is wrong',items:['Sub yarn released too early or held too long — tails tangle with main yarn','Sub yarn not released at all — carried into the fabric']},aDo:'Technician calibration. Only relevant when sub yarn function is in use.'},
  {p:8,n:'Main scissors version',v:'1',k:'tech',unit:'version',what:'Hardware version of the main scissors unit, telling the control which motion profile to use.',a:{t:'When this value is wrong',items:['Wrong motion profile — cut timing off, blades strike the hook or plate','Usually only wrong after a scissors unit replacement']},aDo:'Match it to the label on the installed scissors unit after any replacement.'},
  {p:8,n:'Angle of the main scissors when hooked at the highest point (v1, v2)',v:'40',k:'tech',unit:'deg',what:'Servo angle of the main scissors at the top of its hooked position — the peak of the hook trajectory where it carries the yarn.',a:{t:'When this value is wrong',items:['Hook carries the yarn too low or too high — yarn slips off or never engages','Scissors strike neighbouring parts at the top of travel']},aDo:'Technician calibration after scissors servo or mechanical service. Both v1 and v2 must be set as a pair.'},
  {p:8,n:'Angle of the main scissors when released yarn (v1, v2)',v:'8',k:'tech',unit:'deg',what:'Servo angle of the main scissors at the yarn release point — where the hook lets go of the yarn for the cut and seal.',a:{t:'When this value is wrong',items:['Yarn released too early — drops before the cut, tail hangs loose','Yarn released too late — dragged through the seal, puckered edge']},aDo:'Technician calibration, set together with the hooked angle as one trajectory.'},
  {p:8,n:'Sub scissors version',v:'0',k:'tech',unit:'version',what:'Hardware version of the sub scissors unit. Version 0 = the standard/basic sub scissors fitted.',a:{t:'When this value is wrong',items:['Wrong motion profile for the fitted unit — sub yarn cut timing off','Only wrong after a sub scissors unit swap']},aDo:'Match to the label on the installed unit after replacement.'},
  {p:8,n:'Angle of the sub scissors when hooked at the highest point (v1, v2)',v:'40',k:'tech',unit:'deg',what:'Servo angle of the sub scissors at the top of its hooked position, carrying the sub yarn.',a:{t:'When this value is wrong',items:['Sub yarn slips off the hook before the cut — uncut sub yarn tails','Hook strikes parts at the top of travel']},aDo:'Technician calibration after sub scissors service.'},
  {p:8,n:'Angle of the sub scissors when released yarn (v1, v2)',v:'8',k:'tech',unit:'deg',what:'Servo angle of the sub scissors at the release point — where it lets go of the sub yarn.',a:{t:'When this value is wrong',items:['Sub yarn dropped early or dragged — tails at the wrong spot in the fabric']},aDo:'Technician calibration, set together with the hooked angle.'},
  {p:9,n:'Broken needle detection signal start (back)',v:'285',k:'tech',unit:'position',what:'Starting position of the detection window on the rear bed — where the broken-needle sensor signal begins to be evaluated.',a:{t:'When this value is wrong',items:['Window starts too late — a broken needle in the first part of the pass is missed','Window too early — normal needle motion triggers false stops']},aDo:'Technician set. If false trips occur with detection ON, clean the sensor before touching these windows.'},
  {p:9,n:'Broken needle detection signal end (back)',v:'90',k:'tech',unit:'position',what:'End position of the rear-bed detection window. Together with the start it brackets where broken needles are looked for.',a:{t:'When this value is wrong',items:['Window ends too early — breaks near the end of the pass are missed','Window too wide — false trips from parts entering the view']},aDo:'Technician set as a pair with the start position.'},
  {p:9,n:'Broken needle detection signal start (front)',v:'20',k:'tech',unit:'position',what:'Starting position of the detection window on the front bed.',a:{t:'When this value is wrong',items:['Same behaviour as the rear window — missed breaks or false trips on the front bed']},aDo:'Technician set; restore after sensor or carriage service.'},
  {p:9,n:'Broken needle detection signal end (front)',v:'192',k:'tech',unit:'position',what:'End position of the front-bed detection window.',a:{t:'When this value is wrong',items:['Front-bed breaks near the end of the pass go undetected']},aDo:'Technician set as a pair with the front start position.'},
  {p:9,n:'Cylinder location during broken needle detection (1)',v:'50',k:'tech',unit:'position',what:'Cylinder position reference used during the first half of the broken-needle check — the sensor evaluates needles against this selection state.',a:{t:'When this value is wrong',items:['Detection compares against the wrong selection state — false broken-needle alarms','Actual broken needles masked by the wrong reference']},aDo:'Technician set after cylinder or sensor service; never a production tuning value.'},
  {p:9,n:'Cylinder location during broken needle detection (2)',v:'51',k:'tech',unit:'position',what:'Second cylinder reference position for the second half of the broken-needle check.',a:{t:'When this value is wrong',items:['Same as above — the two reference positions must match the actual selection state during detection']},aDo:'Technician set; change only together with reference (1).'},
  {p:9,n:'Primary and secondary switching solenoid running logic',v:'0',k:'tech',unit:'logic',what:'Control logic mode for the primary/secondary yarn switching solenoids. 0 = the default switching sequence.',a:{t:'When to change it',items:['Only when the machine documentation for a specific yarn system calls for a different solenoid sequence','A non-zero value here with standard hardware causes switching faults and missed yarn changes']},aDo:'Keep at 0 for standard setups. Restore after control board or software updates.'},
  {p:9,n:'Sub yarn solenoid running logic',v:'0',k:'tech',unit:'logic',what:'Control logic mode for the sub yarn solenoid. 0 = default sequence for the standard sub yarn feeder.',a:{t:'When to change it',items:['Only per documentation for a non-standard sub yarn feeder','Wrong logic — sub yarn feeds at the wrong time or not at all']},aDo:'Keep at 0 unless a technician installs a different sub yarn system.'},
  {p:9,n:'Tricolor yarn solenoid running logic',v:'0',k:'tech',unit:'logic',what:'Control logic mode for the tricolor (three-yarn) switching solenoids. 0 = default.',a:{t:'When to change it',items:['Only for machines fitted with the optional tricolor yarn system','Wrong logic — color yarns switch at wrong courses']},aDo:'Keep at 0 on standard two-yarn machines; this setting does nothing until the option is fitted.'},
  {p:9,n:'Languages',v:'English',k:'select',what:'Display language of the operator screen.',a:{t:'Choosing the language',items:['Set to the language your operators read best — menu names must be understood under pressure','Changing language never affects machine behaviour or settings']}}
,
  {p:10,n:'Size selection',v:'M',k:'select',what:'Chooses the glove size pattern. The machine adjusts stitch counts and finger shaping so the knitted glove matches the ordered size.',a:{t:'Choosing the size',items:['Set S / M / L / XL exactly per the order sheet — a wrong size is a full batch of rejects','After changing size, run one piece at first-run speed and measure before full production']}},
  {p:10,n:'Type selection',v:'General',k:'select',what:'Selects the pattern family — General for standard five-finger gloves, or special styles (conjoined, half-finger) that use the extra finger settings on page 3.',a:{t:'Choosing the type',items:['Use General for normal gloves — it ignores the special finger-tip and conjoined-palm settings','Switch type only together with the matching pattern file and size card']}},
  {p:10,n:'Dropping detection',v:'OFF',k:'toggle',what:'When ON, the machine stops if a finished glove does not drop off the needles, preventing it from being knitted into the next glove.',a:{t:'When to turn it ON',items:['Turn ON if gloves hang up on needles or you get double-knitted pieces','Turn OFF for normal stable running — lint on the sensor causes false stops']},b:{t:'When OFF (current)',items:['Fine while dropping is reliable','Check the drop chute and needle condition if stuck gloves appear']}},
  {p:10,n:'Sub yarn function',v:'OFF',k:'toggle',what:'Feeds a second (sub) yarn together with the main yarn to reinforce zones such as the wrist cuff or palm.',a:{t:'When to turn it ON',items:['For orders requiring reinforced cuff or palm areas','Remember to also turn ON sub scissors so the sub yarn is cut cleanly']},b:{t:'When OFF (current)',items:['Normal single-yarn knitting — saves yarn and cycle time','Correct setting for standard gloves']}},
  {p:10,n:'Overlocking function',v:'ON',k:'toggle',what:'Enables the overlocking head that sews the elastic wrist edge. This must be ON for any glove with a finished elastic wrist.',a:{t:'When ON (current)',items:['Required for all standard finished gloves — do not switch off mid-order','Pair with correct hook/cut yarn laps on page 3']},b:{t:'When to turn it OFF',items:['Only for unfinished-cuff pieces or maintenance of the overlock head','If off, the wrist edge unravels — never ship gloves knitted this way']}},
  {p:10,n:'Knotting function',v:'0',k:'num',unit:'wraps',what:'Number of wraps the knotter makes to tie the yarn end when changing or finishing. Set to 0, knotting is currently disabled.',a:{t:'Value too HIGH',items:['Knot becomes bulky and jams at the knotter or needle hooks','Knot visible as a lump inside the glove','Longer cycle time per knot']},aDo:'Decrease toward 1 or 0 if the knot jams or shows as a defect; check and clean the knotter blades first.',b:{t:'Value too LOW (or 0 = off)',items:['Yarn ends not tied — can unravel at the wrist or seam','Loose tails appear during wearing or washing']},bDo:'Increase to 1–2 wraps if ends come loose; 0 is fine only when yarn ends are sealed by overlocking instead.'},
  {p:10,n:'Blowing function',v:'ON',k:'toggle',what:'Air blow clears cut yarn ends and lint away from the knitting zone and drop area after each piece.',a:{t:'When ON (current)',items:['Keeps needles and sinkers clean — fewer dropped stitches','Essential for dark yarns where lint shows']},b:{t:'When to turn it OFF',items:['If air pressure is weak and the blower stalls the cycle','Very light yarns that fly around and tangle with the blow']}},
  {p:10,n:'Sub scissors function',v:'OFF',k:'toggle',what:'Second scissors that cut the sub (second) yarn. Only active when the sub yarn function is used.',a:{t:'When to turn it ON',items:['Must be ON whenever sub yarn function is ON — otherwise the sub yarn is never cut and tangles']},b:{t:'When OFF (current)',items:['Correct for normal single-yarn production']}},
  {p:10,n:'Cancel half needle function',v:'OFF',k:'toggle',what:'Cancels half-needle knitting on the small-palm side. Half needles narrow the little-finger side of the palm for shaping.',a:{t:'When to turn it ON',items:['For straight, non-shaped patterns that must not narrow','When half needles are mechanically faulty and you must keep production running temporarily']},b:{t:'When OFF (current)',items:['Normal shaping is active — palm tapers correctly toward the little finger','Keep OFF for all standard fitted gloves']}},
  {p:10,n:'Sealing sequence',v:'Cut first',k:'select',what:'Order of operations at the wrist edge — here the yarn is cut first, then sealed (overlocked).',a:{t:'Choosing the sequence',items:['Cut first: clean edge, standard for most yarns — current setting is correct','Seal first: only for slippery yarns that pull back when cut; test one piece before switching']}},
  {p:10,n:'Main scissors releasing sequence',v:'Successively',k:'select',what:'How the main scissors release after cutting — successively (one after another) or simultaneously.',a:{t:'Choosing the sequence',items:['Successively: gentler on fine yarns, less shock on the blade — current setting','Simultaneous: faster cycle, use for coarse yarns only']}},
  {p:10,n:'Distance of half needle on small palm',v:'Short distance',k:'select',what:'Spacing of the half needles on the little-finger side of the palm. Changes how sharply the palm tapers.',a:{t:'Choosing the distance',items:['Short distance: stronger taper, snug little-finger side — current setting','Long distance: straighter palm, roomier fit; switch if gloves feel tight across the palm']}},
  {p:10,n:'Half needle function of yarn fixing',v:'OFF',k:'toggle',what:'Uses the half needles to hold and fix the yarn at the start of a piece, anchoring the first courses.',a:{t:'When to turn it ON',items:['When the starting yarn slips and the first rows are loose or ladder','On slippery or elastic-blend yarns that do not grip at cast-on']},b:{t:'When OFF (current)',items:['Normal cast-on holds fine with the standard yarn']}},
  {p:10,n:'Head speed when inserting elastic yarn',v:'130 (function ON)',k:'num',unit:'speed',what:'Carriage speed while the elastic yarn is being laid into the wrist. It runs slower than normal knitting so the elastic is placed evenly.',a:{t:'Value too HIGH',items:['Elastic laid loose, wavy or with gaps at the wrist','Missed elastic stitches and uneven tension around the cuff','Higher elastic breakage from snatching']},aDo:'Decrease toward 100–110 if the elastic line looks wavy or the wrist tension is uneven.',b:{t:'Value too LOW',items:['Elastic pulled too tight — stiff, narrow wrist','Elastic feeder drags, elastic snaps frequently','Slower cycle with no quality gain']},bDo:'Increase toward 130–140 if the wrist is puckered or the elastic keeps snapping from over-stretch.'},
  {p:10,n:'Laps of releasing yarn on intact finger',v:'2',k:'num',unit:'laps',what:'How many courses of yarn are released (floated) when forming the web next to a normal closed finger.',a:{t:'Value too HIGH',items:['Weak, loose web between fingers — holes too large','Extra yarn consumption and longer cycle']},aDo:'Decrease to 1–2 if the web feels flimsy or holes appear at the finger base.',b:{t:'Value too LOW',items:['Fingers joined together or web too tight','Stress on yarn at finger separation → breakage']},bDo:'Increase toward 2–3 if fingers are sticking together or yarn keeps breaking at the web.'},
  {p:10,n:'Laps of releasing yarn on hole finger',v:'3',k:'num',unit:'laps',what:'Yarn courses released when forming the finger that carries an opening/hole (for styles with a hole or different finger structure).',a:{t:'Value too HIGH',items:['Opening too large, edge unsupported','Yarn waste, longer cycle']},aDo:'Decrease to 2 if the hole edge is loose or oversized.',b:{t:'Value too LOW',items:['Hole too small or closes up','Yarn tension spike → snapped yarn at the finger']},bDo:'Increase to 3–4 if the hole closes or yarn breaks at that finger.'},
  {p:10,n:'Rear density value of half needle',v:'11',k:'num',unit:'density',what:'Knitting density on the rear bed where half needles work the small palm. Higher number = tighter fabric.',a:{t:'Value too HIGH',items:['Small palm too tight — glove fits small, yarn breaks at the taper','Visible density step where half needles engage']},aDo:'Decrease by 1–2 if the palm side feels tight or yarn breaks at the little-finger base.',b:{t:'Value too LOW',items:['Loose, shapeless small palm','Holes or ladders between fingers']},bDo:'Increase by 1–2 if the small palm looks baggy or shows holes.'},
  {p:10,n:'Idling speed',v:'160',k:'num',unit:'speed',what:'Speed for running the machine unloaded — used for warm-up after oiling and for clearing lint before production.',a:{t:'Value too HIGH',items:['Unnecessary wear and heat when running empty','Risk of missed lubrication points on fast dry runs']},aDo:'Decrease to 120–140 for warm-up runs; idling does not need full speed.',b:{t:'Value too LOW',items:['Warm-up takes too long, oil does not reach all points','Ineffective lint clearing']},bDo:'Increase toward 160 if warm-up cycles run too slowly — never exceed the manual limit for unloaded running.'},
  {p:10,n:'Jogging speed',v:'20',k:'num',unit:'speed',what:'Inching speed for setup — moving the carriage step by step while fitting needles, checking cams or finding pattern start.',a:{t:'Value too HIGH',items:['Carriage overshoots position during setup','Danger to hands and tools at the needle bed']},aDo:'Keep it low — 15–25 is the safe setup band. Never jog fast with hands near the bed.',b:{t:'Value too LOW',items:['Setup becomes painfully slow — only a time issue, no quality risk']},bDo:'Increase slightly to 25–30 if setup feels sluggish, but never trade safety for speed here.'},
  {p:11,n:'Reboot speed',v:'120',k:'num',unit:'speed',what:'Speed the machine accelerates to right after a restart or reset, before settling into normal production.',a:{t:'Value too HIGH',items:['Yarn or needle breakage in the first seconds after restart','Missed yarn pickups right after a stop — defects at restart point']},aDo:'Decrease toward sealing speed (100–120) or add slow restart laps if restarts keep breaking yarn.',b:{t:'Value too LOW',items:['Every stop costs more recovery time — lost output across the shift','Long slow stretch before reaching production speed']},bDo:'Increase toward 120–130 once restarts run clean; match it roughly to sealing speed.'},
  {p:11,n:'Sealing speed',v:'120',k:'num',unit:'speed',what:'Carriage speed while the wrist edge is being sealed (overlocked). Kept moderate so the overlock head tracks the needles precisely.',a:{t:'Value too HIGH',items:['Overlock seam skips stitches or misses the edge','Cut elastic, damaged wrist edge, more rejects at inspection']},aDo:'Decrease to 100–110 if wrist edges show skipped seams or the overlock head mis-tracks.',b:{t:'Value too LOW',items:['Wrist section takes too long — bottlenecks the whole cycle']},bDo:'Increase toward 120–130 only after the seam is confirmed clean at current speed.'},
  {p:11,n:'Speed before changing fingers',v:'120',k:'num',unit:'speed',what:'Speed the carriage must drop to just before the finger-change mechanism engages, so the cams can shift cleanly.',a:{t:'Value too HIGH',items:['Finger cams fail to engage — misaligned or stuck fingers','Pattern distortion at the finger roots, machine alarms']},aDo:'Decrease to 80–100 if you get finger-change faults or misaligned fingers.',b:{t:'Value too LOW',items:['Cycle time grows with no quality benefit']},bDo:'Increase gradually up to 120 once finger changes run fault-free.'},
  {p:11,n:'Speed of changing yarn',v:'80',k:'num',unit:'speed',what:'Carriage speed during the yarn exchange (transferring knitting from old yarn to new at change or start).',a:{t:'Value too HIGH',items:['New yarn not picked up — float stitches, dropped courses','Knots or tails pulled through the fabric']},aDo:'Decrease to 60–70 if you see float stitches or missed pickups after a yarn change.',b:{t:'Value too LOW',items:['Yarn change drags — time loss only, low quality risk']},bDo:'Increase toward 90–100 only when every change is confirmed clean.'},
